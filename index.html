<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" href="./styles.css">
    <title>Guitar Oracle</title>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <h1 class="header-title">Guitar Oracle</h1>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            
            <!-- Scale Generator Section -->
            <section class="scale-generator" aria-labelledby="scale-generator-heading">
                <h2 id="scale-generator-heading">Scale Generator</h2>
                <div class="key-buttons" role="group" aria-label="Key Buttons">
                    <button type="button" class="btn key-btn cKey-btn" aria-label="Key of C">C</button>
                    <button type="button" class="btn key-btn fKey-btn" aria-label="Key of F">F</button>
                    <button type="button" class="btn key-btn bbKey-btn" aria-label="Key of B flat">Bb</button>
                    <button type="button" class="btn key-btn ebKey-btn" aria-label="Key of E flat">Eb</button>
                    <button type="button" class="btn key-btn abKey-btn" aria-label="Key of A flat">Ab</button>
                    <button type="button" class="btn key-btn dbKey-btn" aria-label="Key of D flat">Db</button>
                    <button type="button" class="btn key-btn gKey-btn" aria-label="Key of G">G</button>
                    <button type="button" class="btn key-btn dKey-btn" aria-label="Key of D">D</button>
                    <button type="button" class="btn key-btn aKey-btn" aria-label="Key of A">A</button>
                    <button type="button" class="btn key-btn eKey-btn" aria-label="Key of E">E</button>
                    <button type="button" class="btn key-btn bKey-btn" aria-label="Key of B">B</button>
                    <button type="button" class="btn key-btn fsKey-btn" aria-label="Key of F sharp">F#</button>
                    <button type="button" class="btn key-btn csKey-btn" aria-label="Key of C sharp">C#</button>
                </div>
                <div id="message" class="message" aria-live="polite"></div>
                <div id="type-btn" class="type-buttons" role="group" aria-label="Scale Type Buttons">
                    <button type="button" class="btn btn-success major-btn" aria-label="Major Scale">Major</button>
                    <button type="button" class="btn btn-warning minor-btn" aria-label="Minor Scale">Minor</button>
                </div>
                <div id="scale-results" class="scale-results" aria-live="polite">The Guitar Oracle is Listening</div>
            </section>

            <!-- Fretboard Section -->
            <section id="scale-diagram" class="scale-diagram" aria-labelledby="fretboard-heading">
                <h2 id="fretboard-heading">Fretboard Diagram</h2>
                <div id="fretboard-controls" class="fretboard-controls">
                    <button class="btn btn-outline-secondary" onclick="updateNumberOfFrets(5)">5 Frets</button>
                    <button class="btn btn-outline-secondary" onclick="updateNumberOfFrets(12)">12 Frets</button>
                    <button class="btn btn-outline-secondary" onclick="updateNumberOfFrets(24)">24 Frets</button>
                </div>
                <div id="fretboard1" class="fretboard1 fretboard-24" role="region" aria-label="Fretboard">
                    <!-- Fretboard notes will be dynamically generated here -->
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Guitar Oracle. All rights reserved.</p>
        </div>
    </footer>

    <script src="./guitar.js" type="module"></script>
</body>
</html>
